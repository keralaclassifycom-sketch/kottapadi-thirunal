<!doctype html>
<!-- Source for images/og-kottapadi-thirunal.jpg (the WhatsApp / Facebook link preview).
     Not linked from the site. Regenerate with tools/make-og.sh after editing. -->
<html lang="ml">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wdth,wght@75..125,400..800&family=Cinzel:wght@600;700&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0716}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Anek Malayalam",sans-serif;color:#fff}
  .photo{position:absolute;inset:0;background:url(../images/church-lights.jpg) 72% 40%/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,7,22,.97) 0%,rgba(11,7,22,.9) 40%,rgba(11,7,22,.35) 66%,rgba(11,7,22,.05) 100%),
         linear-gradient(0deg,rgba(11,7,22,.75),transparent 40%)}
  .frame{position:absolute;inset:18px;border:2px solid rgba(255,207,74,.55);border-radius:26px}
  .text{position:absolute;left:64px;top:56px;width:640px}
  .church{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;color:#ffcf4a;letter-spacing:.01em}
  .church i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe58a,#f5a524);color:#2a1600;font-size:22px;box-shadow:0 0 18px rgba(255,207,74,.6)}
  h1{margin:18px 0 0;font-weight:800;line-height:1.05;font-size:104px;
     background:linear-gradient(180deg,#fff3c4 0%,#ffcf4a 45%,#d48a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(2px 2px 0 #7a4b00) drop-shadow(4px 4px 0 #4a2c00) drop-shadow(0 12px 22px rgba(0,0,0,.6))}
  h1 span{display:block}
  .year{display:inline-flex;align-items:center;gap:14px;margin-top:14px;padding:10px 26px;border-radius:999px;background:linear-gradient(90deg,#e4167f,#9b0f5a);
        font-weight:800;font-size:34px;box-shadow:0 10px 26px rgba(228,22,127,.45)}
  .year b{font-family:Cinzel,serif;font-size:36px;letter-spacing:.04em}
  .year i{width:8px;height:8px;border-radius:50%;background:#ffcf4a}
  .kodi{margin-top:16px;font-weight:700;font-size:26px;color:#f1e9ff}
  .kodi em{font-style:normal;color:#ffcf4a}
  .chips{position:absolute;left:64px;bottom:66px;display:flex;gap:10px}
  .chips span{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:20px;backdrop-filter:blur(4px)}
  .url{position:absolute;right:46px;bottom:32px;font-family:Cinzel,serif;font-weight:600;font-size:17px;letter-spacing:.06em;color:#fff;opacity:.85;text-shadow:0 2px 8px #000}
  .dots{position:absolute;right:0;top:0;width:520px;height:100%;pointer-events:none;
        background-image:radial-gradient(3px 3px at 20% 30%,#ffd60a,transparent),radial-gradient(3px 3px at 70% 18%,#ff3b5c,transparent),radial-gradient(3px 3px at 85% 60%,#5ec8ff,transparent),radial-gradient(3px 3px at 40% 80%,#22c55e,transparent)}
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div><div class="shade"></div><div class="dots"></div><div class="frame"></div>
    <div class="text">
      <div class="church"><i>✝</i>സെന്റ് ലാസേഴ്സ് ചർച്ച്, കോട്ടപ്പടി</div>
      <h1><span>കോട്ടപ്പടി</span><span>തിരുനാൾ</span></h1>
      <div class="year"><b>2027</b><i></i>ജനുവരി 1 · 2 · 3 · 4</div>
      <div class="kodi"><em>ഡിസംബർ 25</em> — തിരുനാൾ കൊടിയേറ്റം</div>
    </div>
    <div class="chips"><span>📅 പരിപാടികൾ</span><span>🥁 മേളങ്ങൾ</span><span>🗺️ 3D റൂട്ട് മാപ്പ്</span><span>🎺 ബാൻഡ്</span></div>
    <div class="url">KERALACLASSIFYCOM-SKETCH.GITHUB.IO/KOTTAPADI-THIRUNAL</div>
  </div>
</body>
</html>
