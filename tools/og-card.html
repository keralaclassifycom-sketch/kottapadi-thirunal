<!doctype html>
<!-- Source for images/og-kottapadi-thirunal-v3.jpg (the WhatsApp / Facebook link preview).
     Not linked from the site. Regenerate with tools/make-og.sh after editing. -->
<html lang="ml">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wdth,wght@75..125,400..800&family=Cinzel:wght@600;700&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0716}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Anek Malayalam",sans-serif;color:#fff}
  .photo{position:absolute;inset:0;background:url(../images/church-lights.jpg) 72% 40%/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,7,22,.97) 0%,rgba(11,7,22,.92) 44%,rgba(11,7,22,.4) 68%,rgba(11,7,22,.08) 100%),
         linear-gradient(0deg,rgba(11,7,22,.8),transparent 42%)}
  .frame{position:absolute;inset:18px;border:2px solid rgba(255,207,74,.55);border-radius:26px}
  .text{position:absolute;left:60px;top:84px;width:660px}
  .church{display:flex;align-items:center;gap:12px;font-weight:700;font-size:27px;color:#ffcf4a}
  .church .dome{width:46px;height:46px;border-radius:11px;box-shadow:0 0 18px rgba(255,207,74,.45)}
  .church i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe58a,#f5a524);color:#2a1600;font-size:22px;box-shadow:0 0 18px rgba(255,207,74,.6)}
  .feast{margin:10px 0 0;font-weight:700;font-size:21px;line-height:1.4;color:#f1e9ff}
  .logo{display:block;width:560px;margin:14px 0 0 -6px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,207,74,.25))}
  .kodi{margin-top:10px;font-weight:700;font-size:25px;color:#f1e9ff}
  .kodi em{font-style:normal;color:#ffcf4a}
  .url{position:absolute;right:46px;bottom:32px;font-family:Cinzel,serif;font-weight:600;font-size:16px;letter-spacing:.06em;color:#fff;opacity:.85;text-shadow:0 2px 8px #000}
  .dots{position:absolute;right:0;top:0;width:520px;height:100%;pointer-events:none;
        background-image:radial-gradient(3px 3px at 20% 30%,#ffd60a,transparent),radial-gradient(3px 3px at 70% 18%,#ff3b5c,transparent),radial-gradient(3px 3px at 85% 60%,#5ec8ff,transparent),radial-gradient(3px 3px at 40% 80%,#22c55e,transparent)}
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div><div class="shade"></div><div class="dots"></div><div class="frame"></div>
    <div class="text">
      <div class="church"><img class="dome" src="../images/icon-512.png" alt="">സെൻറ് ലാസേഴ്സ് ചർച്ച്, കോട്ടപ്പടി</div>
      <p class="feast">വി. ലാസറിന്റെയും വി. സെബാസ്ത്യനോസിന്റെയും<br>പരിശുദ്ധ കന്യകാമറിയത്തിന്റെയും തിരുനാൾ മഹാമഹം</p>
      <img class="logo" src="../images/logos/kottapadi-thirunal.webp" alt="">
      <div class="kodi"><em>ഡിസംബർ 25</em> — തിരുനാൾ കൊടിയേറ്റം</div>
    </div>
    <div class="url">KERALACLASSIFYCOM-SKETCH.GITHUB.IO/KOTTAPADI-THIRUNAL</div>
  </div>
</body>
</html>
