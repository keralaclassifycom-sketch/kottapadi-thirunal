<!doctype html>
<!-- Source for images/qr-kottapadi-thirunal-poster.png (1400 x 1800). Render with headless Chrome, as in tools/make-og.sh. -->
<html lang="ml">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wdth,wght@75..125,400..800&family=Cinzel:wght@600;700&display=block">
<style>
  html,body{margin:0;width:1400px;height:1800px;overflow:hidden}
  body{background:linear-gradient(180deg,#120c40 0%,#1d0f3f 45%,#3a1028 100%);color:#fff;font-family:"Anek Malayalam",sans-serif;text-align:center}
  .dome{display:block;width:110px;height:110px;margin:50px auto 0;border-radius:24px;box-shadow:0 0 40px rgba(255,207,74,.35)}
  .logo{display:block;width:760px;margin:26px auto 0}
  .church{margin:22px 0 0;font-size:40px;font-weight:700;color:#ffcf4a}
  .feast{margin:8px 0 0;font-size:25px;font-weight:600;color:#e6dcff;line-height:1.4}
  .card{width:800px;height:800px;margin:32px auto 0;background:#fff;border:12px solid #ffcf4a;border-radius:44px;display:grid;place-items:center}
  .card img{width:666px;height:666px;image-rendering:pixelated}
  .scan{margin:36px 0 0;font-family:"Anek Malayalam",sans-serif;font-weight:800;font-size:40px;letter-spacing:.02em;color:#ffcf4a}
  .url{margin:14px 0 0;font-family:Cinzel,serif;font-weight:700;font-size:44px;letter-spacing:.04em;color:#fff}
</style>
</head>
<body>
  <img class="dome" src="../images/icon-512.png" alt="">
  <img class="logo" src="../images/logos/kottapadi-thirunal.webp" alt="">
  <p class="church">സെൻറ് ലാസേഴ്സ് ചർച്ച്, കോട്ടപ്പടി</p>
  <p class="feast">വി. ലാസറിന്റെയും വി. സെബാസ്ത്യനോസിന്റെയും<br>പരിശുദ്ധ കന്യകാമറിയത്തിന്റെയും തിരുനാൾ മഹാമഹം</p>
  <div class="card"><img src="qr-plain.png" alt=""></div>
  <p class="scan">സ്കാൻ ചെയ്യൂ — തിരുനാൾ വെബ്സൈറ്റ് തുറക്കാം</p>
  <p class="url">kottapadithirunal.in</p>
</body>
</html>
